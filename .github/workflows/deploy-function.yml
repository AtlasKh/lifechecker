name: Deploy Supabase function

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/deploy-function.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wkjszhpgdvdjfnqfbxqy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy lifecal
        run: npx -y supabase@latest functions deploy lifecal --remote="$PROJECT_REF" --no-verify-jwt --yes
