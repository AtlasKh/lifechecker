<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0704">
<title>Мій рік — календар життя</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0704;
  --bg2:#140c06;
  --amber:#ffb020;
  --amber-hot:#ff8a00;
  --gold:#ffd88a;
  --text:#fff4e2;
  --muted:rgba(255,226,190,.55);
  --faint:rgba(255,226,190,.32);
  --card:rgba(255,170,40,.055);
  --card-hi:rgba(255,170,40,.09);
  --line:rgba(255,190,90,.14);
  --empty:rgba(255,200,130,.075);
  --future:rgba(255,200,130,.03);
  --red:#ff2e4d; --mid:#ffa600; --green:#3dff8f;
  --r:22px;
  --font-d:"Unbounded",system-ui,sans-serif;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);min-height:100%;overscroll-behavior:none}
body{min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* ambient background */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.ambient i:nth-child(1){width:340px;height:340px;background:#ff8a00;top:-140px;left:-120px;opacity:.38}
.ambient i:nth-child(2){width:300px;height:300px;background:#ffb020;top:30%;right:-170px;opacity:.20;animation-duration:28s}
.ambient i:nth-child(3){width:260px;height:260px;background:#ff3d6e;bottom:-120px;left:10%;opacity:.13;animation-duration:34s}
@keyframes drift{to{transform:translate(40px,60px) scale(1.15)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.app{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:18px 16px calc(110px + var(--safe-b))}
.view{animation:fadeUp .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* typography */
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);font-weight:700;opacity:.85}
.title{font-family:var(--font-d);font-weight:800;font-size:44px;line-height:1;margin:8px 0 6px;letter-spacing:-.02em}
.neon{background:linear-gradient(180deg,#fff1c9 0%,#ffc23a 45%,#ff8a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,160,20,.55)) drop-shadow(0 0 2px rgba(255,200,80,.9))}
.greet{margin:0;color:var(--muted);font-size:15px;font-weight:500}
.muted{color:var(--muted)}
h3{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em}

/* hero */
.hero{padding:6px 2px 18px}
.yearbar{margin-top:18px;height:8px;border-radius:99px;background:rgba(255,200,130,.08);overflow:hidden;border:1px solid var(--line)}
.yearbar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#ff6a00,#ffb020 70%,#ffe08a);box-shadow:0 0 14px rgba(255,160,30,.8)}
.yearbar-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted);font-weight:600}

/* cards */
.card{position:relative;background:linear-gradient(180deg,var(--card-hi),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,220,160,.06)}
.card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.card-head .muted{font-size:12px;font-weight:600}

/* CTA */
.cta{position:relative;width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:22px 20px;border-radius:26px;margin-bottom:14px;overflow:hidden;
  background:linear-gradient(135deg,#ffcb52 0%,#ff9d0a 48%,#ff6a00 100%);color:#2a1300;
  box-shadow:0 0 0 1px rgba(255,220,140,.6) inset,0 18px 40px rgba(255,120,0,.35),0 0 60px rgba(255,150,20,.35);transition:transform .15s}
.cta:active{transform:scale(.98)}
.cta::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.45) 80%,transparent 90%);animation:spin 5s linear infinite;opacity:.55}
.cta::after{content:"";position:absolute;inset:2px;border-radius:24px;background:linear-gradient(135deg,#ffcb52 0%,#ff9d0a 48%,#ff6a00 100%)}
@keyframes spin{to{transform:rotate(1turn)}}
.cta>*{position:relative;z-index:1}
.cta-icon{width:52px;height:52px;border-radius:16px;background:rgba(40,15,0,.14);display:grid;place-items:center;font-size:26px;flex:none}
.cta-title{font-family:var(--font-d);font-weight:700;font-size:19px;letter-spacing:-.01em}
.cta-sub{font-size:13px;font-weight:700;opacity:.7;margin-top:4px}
.cta-arrow{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#2a1300;color:#ffc23a;display:grid;place-items:center;font-size:20px;flex:none}

/* today filled */
.today{display:flex;gap:16px;align-items:center}
.today-info{flex:1;min-width:0}
.today-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.today-verdict{font-family:var(--font-d);font-size:18px;font-weight:700;margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 9px;border-radius:99px;background:rgba(255,200,130,.07);border:1px solid var(--line)}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.ybanner{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;margin-bottom:14px;border-radius:18px;
  background:rgba(255,120,40,.07);border:1px dashed rgba(255,150,60,.35);transition:transform .12s}
.ybanner:active{transform:scale(.98)}
.ybanner-dot{width:10px;height:10px;border-radius:50%;background:var(--amber-hot);box-shadow:0 0 12px var(--amber-hot);flex:none;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.ybanner-text{flex:1;display:flex;flex-direction:column;gap:2px}
.ybanner-text b{font-size:14px;font-weight:800}
.ybanner-text span{font-size:12px;color:var(--muted);font-weight:600}
.ybanner-go{color:var(--amber);font-size:18px;font-weight:800}
.lock-note{margin-top:16px;padding:14px;border-radius:16px;text-align:center;font-size:13px;font-weight:700;color:var(--muted);background:rgba(255,200,130,.05);border:1px solid var(--line)}
.link-btn{margin-top:12px;font-size:13px;font-weight:700;color:var(--amber)}

/* ring */
.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg);overflow:visible}
.ring .val{position:absolute;font-family:var(--font-d);font-weight:700}
.ring .val small{font-size:.55em;opacity:.7}

/* week strip */
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wday{display:flex;flex-direction:column;align-items:center;gap:7px}
.wday span{font-size:11px;font-weight:700;color:var(--faint)}
.wday.is-today span{color:var(--amber)}
.cell{aspect-ratio:1;width:100%;border-radius:12px;background:var(--empty);border:1px solid rgba(255,200,130,.06);transition:transform .15s;position:relative}
.cell.future{background:var(--future);border:1px dashed rgba(255,200,130,.09)}
.cell.today-ring{outline:2px solid var(--amber);outline-offset:2px;box-shadow:0 0 16px rgba(255,170,30,.5)}
button.cell:active,.wday:active .cell{transform:scale(.9)}
.cell .num{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:rgba(255,236,210,.6)}
.cell.filled .num{color:rgba(20,8,0,.75)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center}
.tile-num{font-family:var(--font-d);font-weight:700;font-size:24px;color:var(--gold)}
.tile-lbl{font-size:11px;color:var(--muted);font-weight:600;margin-top:4px;line-height:1.25}

/* segmented & period nav */
.page-title{font-family:var(--font-d);font-weight:800;font-size:28px;margin:4px 2px 16px;letter-spacing:-.02em}
.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:16px;background:rgba(255,200,130,.06);border:1px solid var(--line);margin-bottom:14px;position:relative}
.seg button{position:relative;z-index:1;padding:10px 0;font-size:14px;font-weight:700;color:var(--muted);border-radius:12px;transition:color .2s}
.seg button.on{color:#2a1300}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:12px;background:linear-gradient(135deg,#ffcb52,#ff9000);box-shadow:0 0 18px rgba(255,150,20,.55);transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.periodnav{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px}
.periodnav .ptitle{font-family:var(--font-d);font-weight:700;font-size:17px;text-align:center}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:rgba(255,200,130,.07);border:1px solid var(--line);font-size:18px;color:var(--gold);transition:transform .12s}
.icon-btn:active{transform:scale(.9)}
.icon-btn:disabled{opacity:.25}

/* month grid */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.mgrid .wh{font-size:11px;font-weight:700;color:var(--faint);text-align:center;padding-bottom:4px}
.mgrid .cell{border-radius:11px}

/* year grid */
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px}
.ymonth{display:block;align-self:start;text-align:left;padding:2px;border-radius:12px}
.ymonth:active{background:rgba(255,200,130,.05)}
.ymonth-name{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px;display:flex;justify-content:space-between}
.ymonth-name b{color:var(--gold);font-weight:800}
.ymonth.cur .ymonth-name{color:var(--amber)}
.ymini{display:grid;grid-template-columns:repeat(7,1fr);gap:2.5px}
.ymini i{aspect-ratio:1;border-radius:3px;background:var(--empty)}
.ymini i.f{background:var(--future)}
.ymini i.x{background:transparent}
.ymini i.t{outline:1.5px solid var(--amber);outline-offset:1px}

/* week list */
.wlist{display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:rgba(255,200,130,.04);border:1px solid transparent;text-align:left;width:100%}
.wrow.is-today{border-color:rgba(255,176,32,.35);background:rgba(255,176,32,.07)}
.wrow .cell{width:46px;flex:none;border-radius:13px}
.wrow-main{flex:1;min-width:0}
.wrow-day{font-weight:800;font-size:14px}
.wrow-sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.qdots{display:flex;gap:5px}
.qdots i{width:10px;height:10px;border-radius:50%;background:rgba(255,200,130,.1)}
.wrow-pct{font-family:var(--font-d);font-weight:700;font-size:15px;min-width:44px;text-align:right}

.legend{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:11px;color:var(--muted);font-weight:700}
.legend .grad{flex:1;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--red),var(--mid),var(--green));box-shadow:0 0 10px rgba(255,160,30,.35)}

/* stats */
.statmain{display:flex;align-items:center;gap:18px}
.statmain .big{font-family:var(--font-d);font-size:18px;font-weight:700;margin-bottom:6px}
.statline{font-size:13px;color:var(--muted);font-weight:600;margin-top:3px}
.statline b{color:var(--text)}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:6px}
.bar{flex:1;border-radius:6px 6px 3px 3px;min-height:4px;background:var(--empty);position:relative;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.bar.none{background:rgba(255,200,130,.06);height:4px!important}
.bars-axis{display:flex;gap:3px;margin-top:8px}
.bars-axis span{flex:1;text-align:center;font-size:10px;color:var(--faint);font-weight:700;white-space:nowrap;overflow:visible}
.qrow{display:grid;grid-template-columns:24px 76px 1fr 44px;align-items:center;gap:8px;padding:8px 0}
.qrow .e{font-size:18px}
.qrow .n{font-size:13px;font-weight:700}
.track{height:10px;border-radius:99px;background:rgba(255,200,130,.07);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.qrow .v{text-align:right;font-weight:800;font-size:13px}
.best{display:flex;align-items:center;gap:14px}
.best .cell{width:48px;flex:none}
.empty-note{text-align:center;color:var(--muted);font-size:14px;padding:6px 0 2px}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));z-index:20;display:flex;gap:4px;padding:6px;border-radius:24px;
  background:rgba(24,14,6,.78);border:1px solid rgba(255,190,90,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 30px rgba(255,140,0,.12)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 18px;border-radius:18px;color:var(--faint);font-size:10.5px;font-weight:800;transition:all .2s}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--amber);background:rgba(255,176,32,.1);text-shadow:0 0 12px rgba(255,170,30,.7)}
.tab.on svg{filter:drop-shadow(0 0 6px rgba(255,170,30,.8))}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:none}
.sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);animation:fade .25s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:10px 18px calc(22px + var(--safe-b));border-radius:28px 28px 0 0;
  background:linear-gradient(180deg,#1d1209,#120a05);border:1px solid var(--line);border-bottom:0;animation:sheetUp .35s cubic-bezier(.2,.9,.25,1);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.grab{width:40px;height:5px;border-radius:9px;background:rgba(255,200,130,.2);margin:0 auto 16px}
.sheet-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sheet-head .cell{width:56px;flex:none;border-radius:16px}
.sheet-date{font-family:var(--font-d);font-weight:700;font-size:18px}
.arow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid rgba(255,190,90,.08);font-size:14px;font-weight:600}
.arow b{font-weight:800}
.btn-primary{display:block;width:100%;margin-top:16px;padding:17px;border-radius:18px;font-weight:800;font-size:16px;color:#2a1300;
  background:linear-gradient(135deg,#ffcb52,#ff9000);box-shadow:0 10px 30px rgba(255,130,0,.35),0 0 24px rgba(255,160,20,.35);transition:transform .12s}
.btn-primary:active{transform:scale(.98)}

/* quiz */
.quiz{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;padding:14px 18px calc(22px + var(--safe-b));
  background:radial-gradient(120% 70% at 50% 0%,#2a1606 0%,#0b0704 60%)}
.quiz.open{display:flex;animation:fade .25s}
.quiz-inner{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1}
.quiz-top{display:flex;align-items:center;justify-content:space-between}
.quiz-date{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.quiz-progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 0}
.quiz-progress span{height:4px;border-radius:9px;background:rgba(255,200,130,.12);transition:all .3s}
.quiz-progress span.done{background:var(--amber)}
.quiz-progress span.active{background:linear-gradient(90deg,var(--amber),rgba(255,176,32,.25));box-shadow:0 0 10px rgba(255,170,30,.7)}
.quiz-stage{flex:1;display:grid;place-items:center;position:relative;touch-action:pan-y}
.qcard{width:100%;text-align:center;padding:30px 18px;border-radius:32px;background:linear-gradient(180deg,rgba(255,176,32,.1),rgba(255,176,32,.03));
  border:1px solid rgba(255,190,90,.2);box-shadow:0 30px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,220,160,.1);will-change:transform}
.qcard.in{animation:cardIn .42s cubic-bezier(.2,.9,.25,1.15)}
.qcard.back{animation:cardBack .4s cubic-bezier(.2,.9,.25,1.1)}
@keyframes cardIn{from{opacity:0;transform:translateX(60px) rotate(4deg) scale(.95)}}
@keyframes cardBack{from{opacity:0;transform:translateX(-60px) rotate(-4deg) scale(.95)}}
.qemoji{font-size:68px;line-height:1;filter:drop-shadow(0 0 24px rgba(255,170,30,.55));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.qnum{margin-top:20px;font-size:12px;font-weight:800;color:var(--amber);letter-spacing:.2em}
.qtext{font-family:var(--font-d);font-weight:700;font-size:24px;line-height:1.22;margin-top:10px;letter-spacing:-.01em}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ans{padding:20px 0;border-radius:20px;font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:9px;
  background:rgba(255,200,130,.05);border:1.5px solid var(--c);color:var(--text);transition:transform .12s, background .2s, box-shadow .2s}
.ans .dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}
.ans:active{transform:scale(.94)}
.ans.sel,.ans.hit{background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:0 0 26px color-mix(in srgb,var(--c) 45%,transparent)}
.ans-no{--c:var(--red)} .ans-mid{--c:var(--mid)} .ans-yes{--c:var(--green)}
.quiz-hint{text-align:center;font-size:12px;color:var(--faint);font-weight:600;margin-top:14px}

/* result */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.result-cell{width:150px;height:150px;border-radius:40px;background:var(--c);display:grid;place-items:center;position:relative;
  box-shadow:0 0 0 1px rgba(255,255,255,.3) inset,0 0 60px var(--c),0 0 140px color-mix(in srgb,var(--c) 50%,transparent);animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
.result-cell span{font-family:var(--font-d);font-weight:800;font-size:40px;color:rgba(20,8,0,.82)}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}}
.result-title{font-family:var(--font-d);font-weight:800;font-size:26px;margin-top:34px;animation:fadeUp .5s .2s both}
.result-sub{color:var(--muted);font-weight:600;margin-top:8px;animation:fadeUp .5s .3s both}
.result .chips{justify-content:center;margin-top:20px;animation:fadeUp .5s .4s both}
.result .btn-primary{animation:fadeUp .5s .5s both;margin-top:30px}
.spark{position:absolute;left:50%;top:40%;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);opacity:0;animation:spark 1s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.3)}}

.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:60;padding:10px 16px;border-radius:14px;background:#2a1606;border:1px solid var(--line);font-size:13px;font-weight:700;display:none}
</style>
</head>
<body>
<div class="ambient"><i></i><i></i><i></i></div>
<div class="grain"></div>

<main class="app"><div id="view"></div></main>

<nav class="tabbar">
  <button class="tab" data-act="tab" data-arg="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Сьогодні</button>
  <button class="tab" data-act="tab" data-arg="cal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16.5" rx="4"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="8" cy="14" r="1" fill="currentColor"/><circle cx="12" cy="14" r="1" fill="currentColor"/><circle cx="16" cy="14" r="1" fill="currentColor"/></svg>Календар</button>
  <button class="tab" data-act="tab" data-arg="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V11M10 20V5M16 20v-7M22 20H2"/></svg>Статистика</button>
</nav>

<div class="sheet" id="sheet"></div>
<div class="quiz" id="quiz"><div class="quiz-inner" id="quizInner"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* ================= НАСТРОЙКИ ================= */
// Адрес Edge Function в Supabase, без слэша в конце:
// 'https://<REF>.supabase.co/functions/v1/lifecal'. Пусто = данные хранятся только на устройстве.
const API_URL = 'https://wkjszhpgdvdjfnqfbxqy.supabase.co/functions/v1/lifecal';

const QUESTIONS = [
  { id: 'food',  emoji: '🍲', short: 'Їжа',     text: 'Я сьогодні добре поїв?' },
  { id: 'sleep', emoji: '🌙', short: 'Сон',     text: 'Я сьогодні виспався?' },
  { id: 'sport', emoji: '⚡', short: 'Спорт',   text: 'Я сьогодні займався спортом?' },
  { id: 'happy', emoji: '☀️', short: 'Щастя',   text: 'Я сьогодні відчував щастя?' },
  { id: 'dream', emoji: '🚀', short: 'Мрія',    text: 'Я сьогодні став на крок ближче до мрії?' },
];
const OPTIONS = [
  { v: 0,   key: 'no',  label: 'Ні' },
  { v: 0.5, key: 'mid', label: 'Частково' },
  { v: 1,   key: 'yes', label: 'Так' },
];

/* ================= TELEGRAM ================= */
const TG = window.Telegram && window.Telegram.WebApp;
const inTG = !!(TG && TG.initData);
if (TG) {
  try {
    TG.ready(); TG.expand();
    TG.setHeaderColor && TG.setHeaderColor('#0b0704');
    TG.setBackgroundColor && TG.setBackgroundColor('#0b0704');
    TG.setBottomBarColor && TG.setBottomBarColor('#0b0704');
    TG.disableVerticalSwipes && TG.disableVerticalSwipes();
  } catch (e) {}
}
const haptic = {
  tap()  { try { TG.HapticFeedback.impactOccurred('light'); } catch (e) {} },
  pick() { try { TG.HapticFeedback.selectionChanged(); } catch (e) {} },
  ok()   { try { TG.HapticFeedback.notificationOccurred('success'); } catch (e) {} },
};

/* ================= ДАТЫ ================= */
const MONTHS = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const MONTHS_GEN = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const MONTHS_SH = ['С','Л','Б','К','Т','Ч','Л','С','В','Ж','Л','Г'];
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
const WD_LONG = ['Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота','Неділя'];
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const wdIdx = d => (d.getDay() + 6) % 7;
const startOfWeek = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - wdIdx(x)); return x; };
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
const dayOfYear = d => Math.round((d - new Date(d.getFullYear(), 0, 1)) / 864e5) + 1;
const sameDay = (a, b) => keyOf(a) === keyOf(b);

function rangeOf(scale, anchor) {
  if (scale === 'week') { const s = startOfWeek(anchor); return { start: s, end: addDays(s, 6) }; }
  if (scale === 'month') return { start: new Date(anchor.getFullYear(), anchor.getMonth(), 1), end: new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0) };
  return { start: new Date(anchor.getFullYear(), 0, 1), end: new Date(anchor.getFullYear(), 11, 31) };
}
function shift(scale, anchor, dir) {
  if (scale === 'week') return addDays(anchor, 7 * dir);
  if (scale === 'month') return new Date(anchor.getFullYear(), anchor.getMonth() + dir, 1);
  return new Date(anchor.getFullYear() + dir, 0, 1);
}
function periodTitle(scale, anchor) {
  const { start, end } = rangeOf(scale, anchor);
  if (scale === 'week') {
    return start.getMonth() === end.getMonth()
      ? `${start.getDate()} – ${end.getDate()} ${MONTHS_GEN[end.getMonth()]}`
      : `${start.getDate()} ${MONTHS_GEN[start.getMonth()].slice(0,3)} – ${end.getDate()} ${MONTHS_GEN[end.getMonth()].slice(0,3)}`;
  }
  if (scale === 'month') return `${MONTHS[anchor.getMonth()]} ${anchor.getFullYear()}`;
  return String(anchor.getFullYear());
}
function dayLabel(k) {
  const d = parseKey(k), t = today();
  if (sameDay(d, t)) return 'Сьогодні, ' + d.getDate() + ' ' + MONTHS_GEN[d.getMonth()];
  if (sameDay(d, addDays(t, -1))) return 'Вчора, ' + d.getDate() + ' ' + MONTHS_GEN[d.getMonth()];
  return WD_LONG[wdIdx(d)] + ', ' + d.getDate() + ' ' + MONTHS_GEN[d.getMonth()];
}

/* ================= ЦВЕТ ================= */
const STOPS = [[255, 46, 77], [255, 166, 0], [61, 255, 143]];
function colorArr(s) {
  const t = Math.max(0, Math.min(1, s));
  const [a, b, u] = t < .5 ? [STOPS[0], STOPS[1], t * 2] : [STOPS[1], STOPS[2], (t - .5) * 2];
  return a.map((x, i) => Math.round(x + (b[i] - x) * u));
}
const rgb = s => `rgb(${colorArr(s)})`;
const cellStyle = s => s == null ? '' : `background:rgb(${colorArr(s)});border-color:transparent;box-shadow:0 0 14px rgba(${colorArr(s)},.42),inset 0 1px 0 rgba(255,255,255,.3);`;
const ansColor = v => v == null ? 'rgba(255,200,130,.1)' : rgb(v);
const pct = s => Math.round(s * 100);
function verdict(s) {
  if (s >= .9) return 'Сяйливий день ✨';
  if (s >= .7) return 'Чудовий день';
  if (s >= .5) return 'Гарний день';
  if (s >= .3) return 'Так собі день';
  return 'Непростий день';
}

function periodVerdict(scale, s) {
  const noun = { week: 'тиждень', month: 'місяць', year: 'рік' }[scale];
  const adj = s >= .9 ? 'Сяйливий' : s >= .7 ? 'Чудовий' : s >= .5 ? 'Гарний' : s >= .3 ? 'Нерівний' : 'Непростий';
  return adj + ' ' + noun;
}

/* ================= ХРАНИЛИЩЕ ================= */
const LS_KEY = 'lifecal.v1';
let store;
try { store = JSON.parse(localStorage.getItem(LS_KEY)) || null; } catch (e) { store = null; }
if (!store || !store.entries) store = { entries: {}, pending: {} };
const persist = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {} };
const mean = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
function scoreOf(a) {
  const v = QUESTIONS.map(q => a[q.id]).filter(x => typeof x === 'number');
  return v.length ? mean(v) : null;
}
const entry = d => store.entries[typeof d === 'string' ? d : keyOf(d)];
// Отмечать можно только сегодня и вчера (один пропущенный день)
const canFill = k => k === keyOf(today()) || k === keyOf(addDays(today(), -1));

/* ================= СИНХРОНИЗАЦИЯ ================= */
const canSync = () => !!(API_URL && inTG);
async function api(method, path, body) {
  const r = await fetch(API_URL + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': TG.initData },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) { const err = new Error('HTTP ' + r.status); err.status = r.status; throw err; }
  return r.json();
}
async function pushOne(k) {
  if (!canSync()) return;
  const e = store.entries[k];
  try {
    await api('PUT', '/api/entries/' + k, { answers: e.a, tz: -new Date().getTimezoneOffset() });
    delete store.pending[k];
  } catch (err) {
    // 4xx (например, слишком старая дата) — повторять бессмысленно
    if (err.status >= 400 && err.status < 500 && err.status !== 401) delete store.pending[k];
    else store.pending[k] = 1;
  }
  persist();
}
async function sync() {
  if (!canSync()) return;
  for (const k of Object.keys(store.pending || {})) await pushOne(k);
  try {
    const y = today().getFullYear();
    const res = await api('GET', `/api/entries?from=${y - 1}-01-01&to=${y}-12-31`);
    let changed = false;
    for (const e of res.entries || []) {
      const loc = store.entries[e.date];
      if (!loc || (e.updated_at || 0) > (loc.t || 0)) {
        store.entries[e.date] = { a: e.answers, s: e.score, t: e.updated_at }; changed = true;
      }
    }
    if (changed) { persist(); render(); }
  } catch (err) {}
}

/* ================= СТАТИСТИКА ================= */
function computeStats(scale, anchor) {
  const { start, end } = rangeOf(scale, anchor);
  const t = today(), days = [];
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) days.push(d);
  const past = days.filter(d => d <= t);
  const ents = past.map(d => ({ d, e: entry(d) })).filter(x => x.e);
  const avg = ents.length ? mean(ents.map(x => x.e.s)) : null;
  const perQ = QUESTIONS.map(q => {
    const v = ents.map(x => x.e.a[q.id]).filter(n => typeof n === 'number');
    return { q, v: v.length ? mean(v) : null };
  });
  const best = ents.reduce((b, x) => (!b || x.e.s > b.e.s) ? x : b, null);
  let cur = 0, max = 0;
  for (const d of past) { if (entry(d)) { cur++; max = Math.max(max, cur); } else cur = 0; }
  return { start, end, days, elapsed: past.length, filled: ents.length, avg, perQ, best, maxStreak: max };
}
function currentStreak() {
  let d = today(), n = 0;
  if (!entry(d)) d = addDays(d, -1);
  while (entry(d)) { n++; d = addDays(d, -1); }
  return n;
}

/* ================= UI-КУСОЧКИ ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function ring(s, size = 92, stroke = 9) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, v = s == null ? 0 : s;
  const col = s == null ? 'rgba(255,200,130,.2)' : rgb(s);
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,200,130,.09)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - v)}" style="filter:drop-shadow(0 0 6px ${col});transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)"/></svg>
    <div class="val" style="font-size:${size * .24}px;color:${s == null ? 'var(--muted)' : 'var(--text)'}">${s == null ? '—' : pct(s) + '<small>%</small>'}</div></div>`;
}
function dayCell(d, opts = {}) {
  const k = keyOf(d), e = entry(k), t = today();
  const fut = d > t, isT = sameDay(d, t);
  const cls = ['cell', e ? 'filled' : '', fut ? 'future' : '', isT ? 'today-ring' : ''].join(' ');
  const num = opts.num ? `<span class="num">${d.getDate()}</span>` : '';
  return `<button class="${cls}" style="${e ? cellStyle(e.s) : ''}" data-act="day" data-arg="${k}">${num}</button>`;
}
function answerChips(a) {
  return `<div class="chips">${QUESTIONS.map(q => `<span class="chip"><i style="background:${ansColor(a[q.id])};box-shadow:0 0 6px ${ansColor(a[q.id])}"></i>${q.short}</span>`).join('')}</div>`;
}
function seg(scale, act) {
  const idx = ['week', 'month', 'year'].indexOf(scale);
  return `<div class="seg"><div class="pill" style="transform:translateX(${idx * 100}%)"></div>
    ${[['week','Тиждень'],['month','Місяць'],['year','Рік']].map(([k, l]) => `<button class="${k === scale ? 'on' : ''}" data-act="${act}" data-arg="${k}">${l}</button>`).join('')}</div>`;
}
function periodNav(scale, anchor, act) {
  const nextStart = rangeOf(scale, shift(scale, anchor, 1)).start;
  return `<div class="periodnav"><button class="icon-btn" data-act="${act}" data-arg="-1">‹</button>
    <div class="ptitle">${periodTitle(scale, anchor)}</div>
    <button class="icon-btn" data-act="${act}" data-arg="1" ${nextStart > today() ? 'disabled' : ''}>›</button></div>`;
}
const legend = () => `<div class="legend"><span>гірше</span><div class="grad"></div><span>краще</span></div>`;

/* ================= ЭКРАНЫ ================= */
const state = { tab: 'home', cal: { scale: 'month', anchor: today() }, st: { scale: 'week', anchor: today() } };

function greeting() {
  const h = new Date().getHours();
  return h < 5 ? 'Доброї ночі' : h < 12 ? 'Доброго ранку' : h < 18 ? 'Добрий день' : 'Добрий вечір';
}

function viewHome() {
  const t = today(), k = keyOf(t), e = entry(k), y = t.getFullYear();
  const doy = dayOfYear(t), total = isLeap(y) ? 366 : 365, yp = Math.round(doy / total * 100);
  const user = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
  const ws = startOfWeek(t);
  const st = computeStats('week', t);
  const yearFilled = Object.keys(store.entries).filter(x => x.startsWith(y + '-')).length;

  const todayBlock = e ? `
    <section class="card"><div class="today">
      ${ring(e.s, 96, 10)}
      <div class="today-info"><div class="today-label">Сьогодні</div>
        <div class="today-verdict">${verdict(e.s)}</div>
        ${answerChips(e.a)}
        <button class="link-btn" data-act="quiz" data-arg="${k}">Змінити відповіді →</button>
      </div></div></section>`
  : `<button class="cta" data-act="quiz" data-arg="${k}">
      <div class="cta-icon">✦</div>
      <div><div class="cta-title">Як минув день?</div><div class="cta-sub">5 питань · 10 секунд</div></div>
      <div class="cta-arrow">→</div></button>`;

  const yk = keyOf(addDays(t, -1));
  const yBanner = entry(yk) ? '' : `<button class="ybanner" data-act="quiz" data-arg="${yk}">
      <span class="ybanner-dot"></span>
      <span class="ybanner-text"><b>Вчора не відмічено</b><span>Ще можна заповнити — лише сьогодні</span></span>
      <span class="ybanner-go">→</span></button>`;

  return `
  <header class="hero">
    <div class="eyebrow">Календар життя</div>
    <h1 class="title">Мій <span class="neon">${y}</span></h1>
    <p class="greet">${greeting()}${user && user.first_name ? ', ' + esc(user.first_name) : ''}</p>
    <div class="yearbar"><div class="yearbar-fill" style="width:${yp}%"></div></div>
    <div class="yearbar-meta"><span>День ${doy} з ${total}</span><span>${yp}% року прожито</span></div>
  </header>
  ${todayBlock}
  ${yBanner}
  <section class="card">
    <div class="card-head"><h3>Цей тиждень</h3><span class="muted">${st.filled} з ${st.elapsed} днів</span></div>
    <div class="weekstrip">${[0,1,2,3,4,5,6].map(i => { const d = addDays(ws, i);
      return `<div class="wday ${sameDay(d, t) ? 'is-today' : ''}">${dayCell(d)}<span>${WD[i]}</span></div>`; }).join('')}</div>
  </section>
  <section class="tiles">
    <div class="tile"><div class="tile-num">${currentStreak()}</div><div class="tile-lbl">🔥 днів<br>поспіль</div></div>
    <div class="tile"><div class="tile-num" style="${st.avg != null ? `color:${rgb(st.avg)};text-shadow:0 0 14px ${rgb(st.avg)}` : ''}">${st.avg != null ? pct(st.avg) + '%' : '—'}</div><div class="tile-lbl">середнє<br>за тиждень</div></div>
    <div class="tile"><div class="tile-num">${yearFilled}</div><div class="tile-lbl">днів<br>відмічено</div></div>
  </section>`;
}

function viewCalendar() {
  const { scale, anchor } = state.cal, t = today();
  let body = '';
  if (scale === 'month') {
    const y = anchor.getFullYear(), m = anchor.getMonth();
    const first = new Date(y, m, 1), lead = wdIdx(first), n = daysInMonth(y, m);
    body = `<section class="card"><div class="mgrid">${WD.map(w => `<div class="wh">${w}</div>`).join('')}
      ${'<div></div>'.repeat(lead)}${Array.from({ length: n }, (_, i) => dayCell(new Date(y, m, i + 1), { num: true })).join('')}</div>${legend()}</section>`;
  } else if (scale === 'year') {
    const y = anchor.getFullYear();
    body = `<section class="card"><div class="ygrid">${MONTHS.map((name, m) => {
      const first = new Date(y, m, 1), n = daysInMonth(y, m), lead = wdIdx(first);
      const ms = computeStats('month', first);
      const cells = '<i class="x"></i>'.repeat(lead) + Array.from({ length: n }, (_, i) => {
        const d = new Date(y, m, i + 1), e = entry(d);
        const c = e ? `style="${cellStyle(e.s).replace(/box-shadow:[^;]+;/, `box-shadow:0 0 5px rgba(${colorArr(e.s)},.5);`)}"` : '';
        return `<i class="${d > t ? 'f' : ''} ${sameDay(d, t) ? 't' : ''}" ${c}></i>`;
      }).join('');
      const isCur = y === t.getFullYear() && m === t.getMonth();
      return `<button class="ymonth ${isCur ? 'cur' : ''}" data-act="calMonth" data-arg="${m}">
        <div class="ymonth-name"><span>${name.slice(0, 3)}</span>${ms.avg != null ? `<b style="color:${rgb(ms.avg)}">${pct(ms.avg)}</b>` : ''}</div>
        <div class="ymini">${cells}</div></button>`;
    }).join('')}</div>${legend()}</section>`;
  } else {
    const ws = startOfWeek(anchor);
    body = `<section class="card"><div class="wlist">${[0,1,2,3,4,5,6].map(i => {
      const d = addDays(ws, i), e = entry(d), fut = d > t;
      return `<button class="wrow ${sameDay(d, t) ? 'is-today' : ''}" data-act="day" data-arg="${keyOf(d)}">
        <div class="cell ${fut ? 'future' : ''}" style="${e ? cellStyle(e.s) : ''}"></div>
        <div class="wrow-main"><div class="wrow-day">${WD_LONG[i]}</div>
          <div class="wrow-sub">${d.getDate()} ${MONTHS_GEN[d.getMonth()]}${!e && !fut ? ' · не відмічено' : ''}${fut ? ' · попереду' : ''}</div></div>
        <div class="qdots">${QUESTIONS.map(q => { const v = e ? e.a[q.id] : null; return `<i style="background:${ansColor(v)};${v != null ? `box-shadow:0 0 6px ${ansColor(v)}` : ''}"></i>`; }).join('')}</div>
        <div class="wrow-pct" style="color:${e ? rgb(e.s) : 'var(--faint)'}">${e ? pct(e.s) + '%' : '—'}</div></button>`;
    }).join('')}</div></section>`;
  }
  return `<h2 class="page-title">Календар</h2>${seg(scale, 'calScale')}${periodNav(scale, anchor, 'calNav')}${body}`;
}

function viewStats() {
  const { scale, anchor } = state.st, t = today();
  const s = computeStats(scale, anchor);
  let bars = [], axis = [];
  if (scale === 'year') {
    const y = anchor.getFullYear();
    for (let m = 0; m < 12; m++) {
      const ms = computeStats('month', new Date(y, m, 1));
      bars.push(ms.avg); axis.push(MONTHS_SH[m]);
    }
  } else {
    s.days.forEach((d, i) => {
      const e = entry(d); bars.push(e ? e.s : null);
      axis.push(scale === 'week' ? WD[i] : ([1, 8, 15, 22, 29].includes(d.getDate()) ? d.getDate() : ''));
    });
  }
  const barsHtml = `<div class="bars">${bars.map(v => v == null ? `<div class="bar none"></div>`
    : `<div class="bar" style="height:${Math.max(6, v * 100)}%;background:linear-gradient(180deg,${rgb(v)},rgba(${colorArr(v)},.35));box-shadow:0 0 10px rgba(${colorArr(v)},.35)"></div>`).join('')}</div>
    <div class="bars-axis">${axis.map(a => `<span>${a}</span>`).join('')}</div>`;

  return `<h2 class="page-title">Статистика</h2>${seg(scale, 'stScale')}${periodNav(scale, anchor, 'stNav')}
  <section class="card statmain">${ring(s.avg, 108, 11)}
    <div><div class="big">${s.avg != null ? periodVerdict(scale, s.avg) : 'Поки порожньо'}</div>
      <div class="statline">Відмічено <b>${s.filled}</b> з <b>${s.elapsed}</b> днів</div>
      <div class="statline">Найкраща серія: <b>${s.maxStreak}</b> 🔥</div></div></section>
  <section class="card"><div class="card-head"><h3>Динаміка</h3><span class="muted">${scale === 'year' ? 'по місяцях' : 'по днях'}</span></div>${barsHtml}</section>
  <section class="card"><div class="card-head"><h3>За питаннями</h3></div>
    ${s.filled ? s.perQ.map(({ q, v }) => `<div class="qrow"><span class="e">${q.emoji}</span><span class="n">${q.short}</span>
      <div class="track"><i style="width:${v == null ? 0 : Math.max(3, v * 100)}%;background:linear-gradient(90deg,rgba(${colorArr(v ?? 0)},.5),${rgb(v ?? 0)});box-shadow:0 0 10px rgba(${colorArr(v ?? 0)},.5)"></i></div>
      <span class="v" style="color:${v == null ? 'var(--faint)' : rgb(v)}">${v == null ? '—' : pct(v) + '%'}</span></div>`).join('')
      : `<div class="empty-note">Відміть хоча б один день — і тут зʼявиться картина</div>`}</section>
  ${s.best ? `<section class="card best"><button class="cell filled" style="${cellStyle(s.best.e.s)}" data-act="day" data-arg="${keyOf(s.best.d)}"></button>
    <div><div class="today-label">Найкращий день</div><div style="font-weight:800;font-size:16px;margin-top:4px">${dayLabel(keyOf(s.best.d))} · ${pct(s.best.e.s)}%</div></div></section>` : ''}`;
}

function render() {
  const v = document.getElementById('view');
  v.className = 'view';
  void v.offsetWidth;
  v.innerHTML = state.tab === 'home' ? viewHome() : state.tab === 'cal' ? viewCalendar() : viewStats();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.arg === state.tab));
}

/* ================= ЛИСТ ДНЯ ================= */
const sheetEl = document.getElementById('sheet');
function openSheet(k) {
  const d = parseKey(k), e = entry(k), fut = d > today();
  sheetEl.innerHTML = `<div class="sheet-bg" data-act="sheetClose"></div><div class="sheet-panel"><div class="grab"></div>
    <div class="sheet-head"><div class="cell ${fut ? 'future' : ''}" style="${e ? cellStyle(e.s) : ''}"></div>
      <div><div class="sheet-date">${dayLabel(k)}</div>
      <div class="muted" style="font-weight:600;font-size:14px;margin-top:3px">${e ? verdict(e.s) + ' · ' + pct(e.s) + '%' : fut ? 'Цей день ще попереду' : 'День не відмічено'}</div></div></div>
    ${e ? QUESTIONS.map(q => { const v = e.a[q.id], o = OPTIONS.find(o => o.v === v);
      return `<div class="arow"><span>${q.emoji}&nbsp; ${q.short}</span><b style="color:${ansColor(v)}">${o ? o.label : '—'}</b></div>`; }).join('') : ''}
    ${canFill(k) ? `<button class="btn-primary" data-act="quiz" data-arg="${k}">${e ? 'Змінити відповіді' : 'Відмітити день'}</button>`
      : fut ? '' : `<div class="lock-note">🔒 ${e ? 'Змінювати можна лише сьогодні та вчора' : 'Пропущений день. Дозаповнити можна лише вчорашній'}</div>`}
  </div>`;
  sheetEl.classList.add('open');
  syncBackButton();
}
function closeSheet() { sheetEl.classList.remove('open'); syncBackButton(); }

/* ================= ОПРОСНИК ================= */
const quizEl = document.getElementById('quiz'), quizInner = document.getElementById('quizInner');
let quiz = null, lock = false;
function openQuiz(k) {
  if (!canFill(k)) return;
  closeSheet();
  const prev = entry(k);
  quiz = { date: k, i: 0, answers: prev ? { ...prev.a } : {} };
  quizEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  renderQuiz('in');
  syncBackButton();
}
function closeQuiz() {
  quiz = null; quizEl.classList.remove('open'); document.body.style.overflow = '';
  syncBackButton(); render();
}
function renderQuiz(anim) {
  const q = QUESTIONS[quiz.i], cur = quiz.answers[q.id];
  quizInner.innerHTML = `
    <div class="quiz-top"><button class="icon-btn" data-act="quizBack">←</button>
      <div class="quiz-date">${dayLabel(quiz.date)}</div>
      <button class="icon-btn" data-act="quizClose">✕</button></div>
    <div class="quiz-progress">${QUESTIONS.map((_, i) => `<span class="${i < quiz.i ? 'done' : i === quiz.i ? 'active' : ''}"></span>`).join('')}</div>
    <div class="quiz-stage" id="stage"><div class="qcard ${anim || ''}" id="qcard">
      <div class="qemoji">${q.emoji}</div>
      <div class="qnum">${quiz.i + 1} / ${QUESTIONS.length}</div>
      <div class="qtext">${quiz.date === keyOf(today()) ? q.text : q.text.replace('сьогодні', 'вчора')}</div></div></div>
    <div class="answers">${OPTIONS.map(o => `<button class="ans ans-${o.key} ${cur === o.v ? 'sel' : ''}" data-act="ans" data-arg="${o.v}"><span class="dot"></span>${o.label}</button>`).join('')}</div>
    <div class="quiz-hint">Свайп картки: ← ні · так →</div>`;
  bindSwipe();
}
function answer(v, btn) {
  if (lock || !quiz) return;
  lock = true;
  haptic.pick();
  quiz.answers[QUESTIONS[quiz.i].id] = v;
  if (btn) btn.classList.add('hit');
  setTimeout(() => {
    lock = false;
    if (!quiz) return;
    if (quiz.i < QUESTIONS.length - 1) { quiz.i++; renderQuiz('in'); }
    else finishQuiz();
  }, 170);
}
function quizBack() {
  if (!quiz) return;
  if (quiz.i > 0) { quiz.i--; renderQuiz('back'); haptic.tap(); } else closeQuiz();
}
function finishQuiz() {
  const s = scoreOf(quiz.answers);
  store.entries[quiz.date] = { a: { ...quiz.answers }, s, t: Date.now() };
  persist();
  pushOne(quiz.date);
  haptic.ok();
  const c = rgb(s);
  const sparks = Array.from({ length: 22 }, (_, i) => {
    const ang = (i / 22) * Math.PI * 2 + Math.random() * .3, dist = 110 + Math.random() * 90;
    return `<i class="spark" style="--x:${Math.cos(ang) * dist}px;--y:${Math.sin(ang) * dist}px;animation-delay:${.15 + Math.random() * .15}s"></i>`;
  }).join('');
  quizInner.innerHTML = `<div class="result" style="--c:${c}">${sparks}
    <div class="result-cell"><span>${pct(s)}%</span></div>
    <div class="result-title">${verdict(s)}</div>
    <div class="result-sub">${dayLabel(quiz.date)} тепер у календарі</div>
    ${answerChips(quiz.answers)}
    <button class="btn-primary" data-act="quizClose" style="max-width:320px">Готово</button></div>`;
}
function bindSwipe() {
  const stage = document.getElementById('stage'), card = document.getElementById('qcard');
  let x0 = null, dx = 0;
  stage.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; card.style.transition = 'none'; });
  stage.addEventListener('pointermove', e => {
    if (x0 == null) return;
    dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    const tint = dx > 0 ? '61,255,143' : '255,46,77';
    card.style.boxShadow = `0 30px 60px rgba(0,0,0,.4),0 0 ${Math.min(60, Math.abs(dx) / 2)}px rgba(${tint},${Math.min(.6, Math.abs(dx) / 200)})`;
  });
  const end = () => {
    if (x0 == null) return;
    x0 = null;
    card.style.transition = 'transform .3s cubic-bezier(.2,.9,.25,1.2), box-shadow .3s';
    if (Math.abs(dx) > 90) {
      card.style.transform = `translateX(${dx > 0 ? 500 : -500}px) rotate(${dx > 0 ? 25 : -25}deg)`;
      answer(dx > 0 ? 1 : 0);
    } else { card.style.transform = ''; card.style.boxShadow = ''; }
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('pointerleave', end);
}

/* ================= НАВИГАЦИЯ ================= */
function syncBackButton() {
  if (!TG || !TG.BackButton) return;
  try { (quiz || sheetEl.classList.contains('open')) ? TG.BackButton.show() : TG.BackButton.hide(); } catch (e) {}
}
if (TG && TG.BackButton) TG.BackButton.onClick(() => { if (quiz) quizBack(); else closeSheet(); });

const actions = {
  tab(a) { if (state.tab !== a) { state.tab = a; haptic.tap(); render(); window.scrollTo(0, 0); } },
  quiz(a) { haptic.tap(); openQuiz(a); },
  day(a) { haptic.tap(); openSheet(a); },
  sheetClose() { closeSheet(); },
  calScale(a) { state.cal.scale = a; state.cal.anchor = today(); haptic.pick(); render(); },
  calNav(a) { state.cal.anchor = shift(state.cal.scale, state.cal.anchor, +a); haptic.pick(); render(); },
  calMonth(a) { state.cal.scale = 'month'; state.cal.anchor = new Date(state.cal.anchor.getFullYear(), +a, 1); haptic.tap(); render(); },
  stScale(a) { state.st.scale = a; state.st.anchor = today(); haptic.pick(); render(); },
  stNav(a) { state.st.anchor = shift(state.st.scale, state.st.anchor, +a); haptic.pick(); render(); },
  ans(a, el) { answer(+a, el); },
  quizBack() { quizBack(); },
  quizClose() { closeQuiz(); },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = actions[t.dataset.act];
  if (fn) fn(t.dataset.arg, t);
});

// Открытие сразу опросника по ссылке бота: t.me/<bot>/<app>?startapp=quiz
const startParam = (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || new URLSearchParams(location.search).get('startapp');
render();
if (startParam === 'quiz' && !entry(today())) openQuiz(keyOf(today()));
if (startParam === 'yesterday' && !entry(addDays(today(), -1))) openQuiz(keyOf(addDays(today(), -1)));
sync();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); sync(); } });
})();
</script>
</body>
</html>
